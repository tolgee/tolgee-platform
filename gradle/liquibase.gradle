ext {
    configureLiquibase = { schema, referenceUrlPrefix, changeLogPah ->
        def liveDb = [
                url         : "jdbc:postgresql://localhost:55538/postgres?currentSchema=$schema",
                referenceUrl: referenceUrlPrefix +
                        '?dialect=io.tolgee.dialects.postgres.CustomPostgreSQLDialect' +
                        '&hibernate.physical_naming_strategy=org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy' +
                        '&hibernate.implicit_naming_strategy=org.springframework.boot.hibernate.SpringImplicitNamingStrategy',
                username    : 'postgres',
                password    : 'postgres',
                driver      : "org.postgresql.Driver"
        ]

        liquibase {
            activities {
                //noinspection GroovyAssignabilityCheck
                main {
                    changelogFile "${project.projectDir}/${changeLogPah}"
                    url liveDb.url
                    referenceUrl liveDb.referenceUrl
                    username liveDb.username
                    password liveDb.password
                    driver liveDb.driver
                    excludeObjects "table:batch_job_execution_context," +
                            "batch_step_execution_seq," +
                            "batch_job_seq," +
                            "batch_job_instance_seq," +
                            "batch_job_execution_seq," +
                            "batch_step_execution_context," +
                            "batch_step_execution," +
                            "batch_job_instance," +
                            "table:batch_job_execution," +
                            "table:batch_job_execution_params," +
                            "hibernate_sequence," +
                            "revision_sequence_generator," +
                            "billing_sequence," +
                            "activity_sequence," +
                            "FK9xs5a07fba5yqje5jqm6qrehs," +
                            "column:enabled_features,"+
                            // Exclude id columns: liquibase-hibernate7 emits a spurious addDefaultValue for them. https://github.com/liquibase/liquibase-hibernate/issues/919
                            "column:(?i)^id\$,"+
                            "table:temp_unsuccessful_job_keys,"+
                            // Spring Authorization Server tables (not JPA entities): managed by db/changelog/oauth2/oauth2-server.xml
                            "table:oauth2_authorization,"+
                            "table:oauth2_authorization_consent,"+
                            // Spring Session tables (not JPA entities): managed by db/changelog/spring-session/spring-session.xml
                            "table:spring_session,"+
                            "table:spring_session_attributes"
                }
            }
        }

        tasks.named('diff') {
            dependsOn 'compileKotlin'
        }

        tasks.register('diffChangeLog') {
            dependsOn 'compileKotlin'
        }
    }
}
