spring:
  autoconfigure:
    exclude:
      - org.redisson.spring.starter.RedissonAutoConfigurationV2
      - org.redisson.spring.starter.RedissonAutoConfigurationV4
      - org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration
  data:
    redis:
      repositories:
        enabled: false
  session:
    # Only the OAuth2 consent flow uses a session; JDBC so it survives across replicas without ingress affinity.
    # Schema comes from Liquibase (db/changelog/spring-session), not Spring Session.
    store-type: jdbc
    # A consent session lives from the bootstrap redirect until Allow, and is invalidated when a code is issued.
    timeout: 10m
    jdbc:
      initialize-schema: never
  mvc:
    pathmatch:
      matching-strategy: ant_path_matcher
    async:
      request-timeout: 180000
  jpa:
    properties:
      hibernate:
        order_by:
          default_null_ordering: first
        jdbc:
          batch_size: 1000
        order_inserts: true
        order_updates: true
        types:
          print:
            banner: false
        dialect: io.tolgee.dialects.postgres.CustomPostgreSQLDialect
  batch:
    job:
      enabled: false
    jdbc:
      initialize-schema: always
tolgee:
  authentication:
    enabled: false
  internal:
    orphan-project-purge-enabled: true
  postgres-autostart:
    enabled: true
  cache:
    enabled: true
    use-redis: false
    default-ttl: 1200000
server:
  # Do not set forward-headers-strategy: Spring would rebuild each request's origin from X-Forwarded-* with no trust
  # check, letting anyone who can inject X-Forwarded-Host make discovery advertise a token endpoint on their own host.
  # Behind a reverse proxy set tolgee.back-end-url instead.
  compression:
    enabled: true
    mime-types: "text/html,text/xml,text/plain,text/css,text/javascript,application/javascript,application/json"
    min-response-size: 1024
  tomcat:
    max-part-count: 500
sentry:
  dsn: ${tolgee.sentry.server-dsn:}
  traces-sample-rate: ${tolgee.sentry.traces-sample-rate:}
management:
  health:
    ldap:
      enabled: false
    mail:
      enabled: false
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
